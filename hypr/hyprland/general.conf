monitor = ,preferred,auto,1
gesture = 3, horizontal, workspace

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(6b7280aa)
    resize_on_border = true
    layout = dwindle
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000022)
    }
}

animations {
    enabled = true
    bezier = akaneCurve, 0.18, 0.9, 0.2, 1.0
    animation = windowsIn, 1, 5, akaneCurve, popin 85%
    animation = windowsOut, 1, 5, akaneCurve, popin 90%
    animation = windowsMove, 1, 6, akaneCurve
    animation = border, 1, 10, akaneCurve
    animation = fade, 1, 5, akaneCurve
    animation = workspaces, 1, 6, akaneCurve, slide
}

input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
}

gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = 1
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    allow_session_lock_restore = true
    session_lock_xray = true
    focus_on_activate = true
}

binds {
    scroll_event_delay = 0
}
